<svg viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="rBase" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="45%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="rLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d4d4"/>
      <stop offset="30%" stop-color="#8a8a8a"/>
      <stop offset="65%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="rPlateau" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8c8c8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#9a9a9a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a3a3a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rRightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="rContact" cx="38%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#e8e8e8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8e8e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="rGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="2" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.18  0 0 0 0 0.18  0 0 0 0 0.18  0 0 0 0.12 0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
    </filter>
    <filter id="rDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dy="16" result="off"/>
      <feComponentTransfer in="off" result="shadow">
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rClip">
      <path d="M0,520 C0,420 40,390 95,365 C150,340 210,318 290,302 C370,286 450,278 530,282 C610,286 690,298 770,318 C850,338 930,368 1000,400 C1060,428 1120,460 1200,520 L0,520 Z"/>
    </clipPath>
  </defs>

  <ellipse cx="460" cy="508" rx="420" ry="16" fill="#000" opacity="0.55"/>

  <!-- Organic boulder — smooth silhouette, no sawteeth -->
  <path
    d="M0,520
       C0,420 40,390 95,365
       C150,340 210,318 290,302
       C370,286 450,278 530,282
       C610,286 690,298 770,318
       C850,338 930,368 1000,400
       C1060,428 1120,460 1200,520
       Z"
    fill="url(#rBase)"
    filter="url(#rDepth)"
  />

  <path
    d="M0,520
       C0,420 40,390 95,365
       C150,340 210,318 290,302
       C370,286 450,278 530,282
       C610,286 690,298 770,318
       C850,338 930,368 1000,400
       C1060,428 1120,460 1200,520
       L0,520 Z"
    fill="url(#rLit)"
    filter="url(#rGrain)"
    clip-path="url(#rClip)"
  />

  <!-- Flat plateau where phone rests -->
  <ellipse cx="420" cy="295" rx="200" ry="28" fill="url(#rPlateau)"/>
  <ellipse cx="420" cy="292" rx="120" ry="14" fill="url(#rContact)"/>

  <!-- Soft facet planes -->
  <path d="M95,365 C210,318 290,302 420,288 C550,274 690,298 770,318 C850,338 930,368 1000,400 L1000,520 L0,520 Z" fill="#5a5a5a" opacity="0.18"/>
  <path d="M530,282 C610,286 690,298 770,318 C850,338 930,368 1000,400 L1000,520 L680,520 L580,420 Z" fill="#1a1a1a" opacity="0.35"/>

  <!-- Subtle natural cracks (curved, not chevrons) -->
  <path d="M240,328 C268,318 295,322 318,310" stroke="#2a2a2a" stroke-width="1.2" opacity="0.5" fill="none" stroke-linecap="round"/>
  <path d="M360,292 C395,286 430,290 465,284" stroke="#1f1f1f" stroke-width="1" opacity="0.4" fill="none" stroke-linecap="round"/>
  <path d="M620,308 C655,300 688,306 720,298" stroke="#222" stroke-width="0.9" opacity="0.35" fill="none" stroke-linecap="round"/>
  <path d="M180,350 C205,342 228,348 248,338" stroke="#181818" stroke-width="0.8" opacity="0.4" fill="none" stroke-linecap="round"/>

  <!-- Right-side falloff into black -->
  <path d="M680,320 C850,360 1000,400 1200,520 L1200,520 L680,520 Z" fill="url(#rRightFade)"/>

  <!-- Top-left rim light -->
  <path
    d="M95,365 C150,340 210,318 290,302 C370,286 450,278 530,282"
    stroke="#f0f0f0"
    stroke-width="1.5"
    opacity="0.28"
    fill="none"
    stroke-linecap="round"
  />
</svg>
